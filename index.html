<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Encuesta rápida</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h1>Encuesta rápida</h1>

  <p>¿Te gusta esta idea?</p>

  <button onclick="alert('Votaste SÍ')">👍 Sí</button>
  <button onclick="alert('Votaste NO')">👎 No</button>
  <script>
  const tg = window.Telegram.WebApp;
  tg.ready();               // avisa a Telegram que la web está lista
  tg.expand();              // intenta abrir a pantalla completa

  // Opcional: leer info del usuario
  console.log(tg.initDataUnsafe?.user);

  // Opcional: adaptar colores al tema de Telegram
  document.body.style.background = tg.themeParams.bg_color || "#fff";
</script>

</body>
</html>
